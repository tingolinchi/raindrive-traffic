name: Incidencias de tráfico

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede retrasarlo)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["build_traffic.py", ".github/workflows/traffic.yml"]

permissions:
  contents: write   # solo para el latido mensual (ver abajo)
  pages: write
  id-token: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas
        run: python -m unittest -v test_build_traffic
      - name: Generar JSON
        run: python build_traffic.py out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Latido (evita que GitHub desactive el workflow por inactividad a los 60 días)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((30*24*3600)) ]; then
            git config user.name "traffic-bot"
            git config user.email "traffic-bot@users.noreply.github.com"
            git commit --allow-empty -m "latido"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
